services:
  # Backend FastAPI Trading Desk Engine
  - type: web
    name: windscope-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: ELEXON_API_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: CORS_ORIGINS
        value: "*"

  # Frontend React / Vite Trading Desk Portal
  - type: web
    name: windscope-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: windscope-backend
          property: host

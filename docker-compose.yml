services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windscope-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DEBUG=False
      - ELEXON_API_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,*
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - windscope-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windscope-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - windscope-net

networks:
  windscope-net:
    driver: bridge
